[project]
name = "week-01-llm-inference"
version = "0.1.0"
description = "Week 1: trace LLM inference (Gemma 3 270M) on RTX 3050 Ti 4GB"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.6.0+cu124",
    "transformers>=4.51.0,<5",
    "accelerate>=1.4.0,<2",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "jupyterlab>=4.3.0,<5",
    "ipykernel>=6.29.0",
    "huggingface_hub>=0.28.0",
    "ipywidgets>=8.0.0",
    "gguf>=0.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
